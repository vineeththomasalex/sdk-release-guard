name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory TestResults
      - run: dotnet format --verify-no-changes --no-restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: TestResults

  native:
    name: Native fixtures and installed tool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install fixture and schema tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld llvm
          python -m pip install -r scripts/requirements-test.txt
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: python scripts/build-fixtures.py --arch all
      - run: dotnet pack src/SdkReleaseGuard.Cli -c Release --no-build -o artifacts/packages
      - run: dotnet tool install SdkReleaseGuard --version 0.1.0 --tool-path artifacts/tool --add-source artifacts/packages
      - run: python scripts/verify-native.py --tool artifacts/tool/sdk-release-guard
